<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Qilan Admin</title>

<link rel="stylesheet"
href="style.css">

<style>

body{
    background:#f3f6fa;
}

.admin-login{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    background:white;
    width:100%;
    max-width:420px;
    padding:35px;
    border-radius:15px;
    box-shadow:0 5px 25px rgba(0,0,0,.1);
}

.login-box h1{
    color:#0754b8;
    margin-bottom:10px;
}

.login-box p{
    color:#777;
    margin-bottom:20px;
}

.login-box label{
    display:block;
    font-weight:bold;
    font-size:13px;
    margin:12px 0 5px;
}

.login-box input{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:7px;
}

.admin-dashboard{
    display:none;
}

.admin-header{
    background:#0754b8;
    color:white;
    padding:18px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.admin-header h2{
    margin:0;
}

.admin-header button{
    border:0;
    background:white;
    color:#0754b8;
    padding:10px 18px;
    border-radius:6px;
    font-weight:bold;
}

.dashboard{
    padding:30px 5%;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-bottom:25px;
}

.stat{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.stat span{
    display:block;
    color:#777;
    font-size:13px;
}

.stat strong{
    display:block;
    font-size:30px;
    color:#0754b8;
    margin-top:8px;
}

.admin-grid{
    display:grid;
    grid-template-columns:380px 1fr;
    gap:25px;
}

.admin-card{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.admin-card h2{
    color:#0754b8;
    margin-bottom:20px;
}

.admin-card label{
    display:block;
    font-size:12px;
    font-weight:bold;
    margin-top:10px;
}

.admin-card input,
.admin-card select,
.admin-card textarea{
    width:100%;
    padding:10px;
    border:1px solid #ddd;
    border-radius:6px;
    margin-top:5px;
}

.admin-card textarea{
    min-height:80px;
}

.admin-submit{
    width:100%;
    margin-top:15px;
    padding:12px;
    border:0;
    border-radius:7px;
    background:#0754b8;
    color:white;
    font-weight:bold;
}

.cancel-btn{
    width:100%;
    margin-top:8px;
    padding:10px;
    border:0;
    border-radius:7px;
    background:#eee;
}

.admin-table{
    width:100%;
    border-collapse:collapse;
}

.admin-table th,
.admin-table td{
    text-align:left;
    padding:10px;
    border-bottom:1px solid #eee;
    font-size:12px;
}

.admin-table th{
    color:#0754b8;
}

.small-btn{
    border:0;
    padding:7px 10px;
    border-radius:5px;
    margin:2px;
}

.edit-btn{
    background:#e9f2ff;
    color:#0754b8;
}

.delete-btn{
    background:#ffe8eb;
    color:#d71932;
}

.orders-section{
    margin-top:25px;
}

.status-select{
    padding:6px;
}

@media(max-width:900px){

    .admin-grid{
        grid-template-columns:1fr;
    }

}

@media(max-width:600px){

    .stats{
        grid-template-columns:1fr;
    }

    .admin-table{
        min-width:700px;
    }

    .admin-card{
        overflow:auto;
    }

}

</style>

</head>

<body>


<!-- LOGIN -->

<section class="admin-login"
id="loginSection">

    <div class="login-box">

        <h1>Qilan Admin</h1>

        <p>
            Login to manage products and orders.
        </p>


        <label>
            Username
        </label>

        <input
        id="username"
        value="admin">


        <label>
            Password
        </label>

        <input
        id="password"
        type="password">


        <button
        class="admin-submit"
        onclick="login()">

            Login

        </button>

        <p
        id="loginMessage"
        style="margin-top:12px;color:#ef233c;">
        </p>

    </div>

</section>


<!-- DASHBOARD -->

<section
class="admin-dashboard"
id="dashboardSection">


    <header class="admin-header">

        <h2>
            Qilan Admin Panel
        </h2>

        <button onclick="logout()">
            Logout
        </button>

    </header>


    <main class="dashboard">


        <!-- STATS -->

        <div class="stats">

            <div class="stat">

                <span>
                    Products
                </span>

                <strong
                id="productCount">
                    0
                </strong>

            </div>


            <div class="stat">

                <span>
                    Orders
                </span>

                <strong
                id="orderCount">
                    0
                </strong>

            </div>


            <div class="stat">

                <span>
                    Pending Orders
                </span>

                <strong
                id="pendingCount">
                    0
                </strong>

            </div>

        </div>


        <div class="admin-grid">


            <!-- PRODUCT FORM -->

            <div class="admin-card">

                <h2 id="formTitle">
                    Add Product
                </h2>


                <input
                type="hidden"
                id="editId">


                <label>
                    Product Name
                </label>

                <input
                id="productName"
                placeholder="Luxury Bed">


                <label>
                    Category
                </label>

                <select id="productCategory">

                    <option>Beds</option>

                    <option>Sofas</option>

                    <option>Wardrobes</option>

                    <option>TV Stands</option>

                    <option>Dining</option>

                    <option>Coffee Tables</option>

                    <option>Mattresses</option>

                </select>


                <label>
                    Price (Rwf)
                </label>

                <input
                id="productPrice"
                type="number">


                <label>
                    Width (cm)
                </label>

                <input
                id="productWidth"
                type="number">


                <label>
                    Length (cm)
                </label>

                <input
                id="productLength"
                type="number">


                <label>
                    Height (cm)
                </label>

                <input
                id="productHeight"
                type="number">


                <label>
                    Image
                </label>

                <input
                id="productImage"
                placeholder="images/bed.jpg">


                <label>
                    Description
                </label>

                <textarea
                id="productDescription"
                placeholder="Product description"></textarea>


                <button
                class="admin-submit"
                onclick="saveProduct()">

                    Save Product

                </button>


                <button
                class="cancel-btn"
                onclick="resetForm()">

                    Clear Form

                </button>

            </div>


            <!-- PRODUCT LIST -->

            <div class="admin-card">

                <h2>
                    Products
                </h2>

                <div style="overflow:auto">

                    <table
                    class="admin-table">

                        <thead>

                            <tr>

                                <th>ID</th>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Actions</th>

                            </tr>

                        </thead>

                        <tbody
                        id="productsTable">
                        </tbody>

                    </table>

                </div>

            </div>

        </div>


        <!-- ORDERS -->

        <div
        class="admin-card orders-section">

            <h2>
                Customer Orders
            </h2>


            <div style="overflow:auto">

                <table
                class="admin-table">

                    <thead>

                        <tr>

                            <th>ID</th>
                            <th>Product</th>
                            <th>Customer</th>
                            <th>Phone</th>
                            <th>Measure</th>
                            <th>Quantity</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody
                    id="ordersTable">
                    </tbody>

                </table>

            </div>

        </div>


    </main>

</section>


<script src="admin.js"></script>

</body>

</html>
